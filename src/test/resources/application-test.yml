spring:
  application:
    name: payment-ledger-platform-test

  # datasource is overridden at runtime by @DynamicPropertySource in Testcontainer tests
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_ledger}
    username: ${DB_USERNAME:payment_ledger}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # Kafka: bootstrap placeholder for context load tests. Business consumer/producer tests
  # use @EmbeddedKafka in Phase 8 tests.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest

  # Redis: lazy initialization ensures context load tests don't fail on missing Redis container
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms
      connect-timeout: 1000ms

  # Lazy initialization allows tests to start without fully connecting all beans on startup
  main:
    lazy-initialization: true

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # Phase 16: Explicitly enable Prometheus export in test context.
  # Spring Boot 3.x ConditionalOnEnabledMetricsExport checks this property.
  # Without it, the PrometheusMeterRegistry is not auto-configured in test contexts
  # and /actuator/prometheus returns 404.
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  group:
    liveness:
      include: livenessState
    readiness:
      include: readinessState,db

logging:
  level:
    com.paymentledger: DEBUG
    org.flywaydb: INFO
    org.springframework.kafka: WARN
    io.lettuce.core: WARN

app:
  security:
    jwt:
      # Deterministic test-only secret. MUST NOT be used in production.
      # Integration tests must provide TEST_JWT_SECRET; never embed a signing key in source.
      secret: ${TEST_JWT_SECRET}
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000

outbox:
  relay:
    enabled: true
    batch-size: 50
    lease-seconds: 30
    max-retries: 5
    fixed-delay-ms: 100

