server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB
    connection-timeout: 20000ms
    threads:
      max: 200
      min-spare: 20

spring:
  application:
    name: payment-ledger-platform

  lifecycle:
    timeout-per-shutdown-phase: 20s

  servlet:
    multipart:
      enabled: false
      max-file-size: 1MB
      max-request-size: 1MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: PaymentLedgerHikariCP-Prod

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: payment-ledger-group
      auto-offset-reset: earliest
      max-poll-records: 50
      properties:
        spring.json.trusted.packages: "com.paymentledger.*"
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms

  task:
    scheduling:
      pool:
        size: 5
      shutdown:
        await-termination: true
        await-termination-period: 20s
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 100
      shutdown:
        await-termination: true
        await-termination-period: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.paymentledger: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.kafka: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    io.lettuce.core: WARN

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
      refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
  ratelimit:
    auth:
      login-limit: ${AUTH_LOGIN_RATE_LIMIT:5}
      login-window-seconds: 60

outbox:
  relay:
    enabled: true
    batch-size: 50
    lease-seconds: 30
    max-retries: 5
    fixed-delay-ms: 200
