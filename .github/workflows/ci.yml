name: CI Quality Gates

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validation-gates:
    name: Pre-Flight & Migration Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Scripts and Wrapper Executable
        run: chmod +x mvnw scripts/*.sh

      - name: Verify Clean Repository & No Secrets
        run: ./scripts/verify-repo.sh

      - name: Validate Database Migrations
        run: ./scripts/validate-migrations.sh

      - name: Validate Production Configurations & Containers
        run: ./scripts/validate-configs.sh

      - name: Validate Release Attestation Enforcement
        run: ./scripts/validate-release-attestation.sh

  build-and-test:
    name: Build, Test & Coverage Gate
    runs-on: ubuntu-latest
    needs: validation-gates
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Enforce Architecture & Compile
        run: ./mvnw -B clean test-compile

      - name: Execute Full Test Suite & Coverage
        run: |
          TEST_JWT_SECRET="$(openssl rand -base64 48)"
          echo "::add-mask::$TEST_JWT_SECRET"
          echo "TEST_JWT_SECRET=$TEST_JWT_SECRET" >> "$GITHUB_ENV"
          ./mvnw -B verify

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Publish JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

  reproducible-build:
    name: Reproducible Build & Integrity
    runs-on: ubuntu-latest
    needs: validation-gates
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Scripts and Wrapper Executable
        run: chmod +x mvnw scripts/*.sh

      - name: Verify Reproducibility Configuration
        run: ./scripts/verify-reproducibility.sh

      - name: Package Deterministic Artifact
        run: ./mvnw -B package -DskipTests

      - name: Generate and Verify SHA-256 Checksums
        run: |
          mkdir -p dist
          cp target/*.jar dist/
          cd dist
          for f in *.jar; do
            if [[ "$f" != original-* && -f "$f" ]]; then
              sha256sum "$f" | tee "$f.sha256"
            fi
          done

      - name: Upload Verified Release Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: dist/
          retention-days: 30

  ci-quality-gate:
    name: Quality Gate Evaluation
    runs-on: ubuntu-latest
    if: always()
    needs: [validation-gates, build-and-test, reproducible-build]
    steps:
      - name: Evaluate Pipeline Status
        run: |
          echo "======================================================="
          echo " EVALUATING MANDATORY CI QUALITY GATES"
          echo "======================================================="
          VG_RESULT="${{ needs.validation-gates.result }}"
          BT_RESULT="${{ needs.build-and-test.result }}"
          RB_RESULT="${{ needs.reproducible-build.result }}"
          echo "Pre-Flight & Migration Gates:    $VG_RESULT"
          echo "Build, Test & Coverage Gate:     $BT_RESULT"
          echo "Reproducible Build & Integrity:  $RB_RESULT"
          if [[ "$VG_RESULT" != "success" || "$BT_RESULT" != "success" || "$RB_RESULT" != "success" ]]; then
            echo "======================================================="
            echo " [ERROR] One or more mandatory CI quality gates failed or were skipped!"
            echo " CANNOT PROCEED TO MERGE."
            echo "======================================================="
            exit 1
          fi
          echo "======================================================="
          echo " ALL CI QUALITY GATES COMPLETED WITH 100% PASS RATE"
          echo " - Pre-flight & Migration Validation: PASSED"
          echo " - Unit & Integration Test Suite:     PASSED"
          echo " - JaCoCo Coverage Analysis:          PASSED"
          echo " - Reproducible Build Verification:   PASSED"
          echo " ELIGIBLE FOR MERGE TO PROTECTED BRANCH"
          echo "======================================================="
